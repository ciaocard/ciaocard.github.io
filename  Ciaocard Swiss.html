    if(m.b===null){const r=rec[m.a]; r.w++; r.pts+=3; r.byes++; return;}
    if(!m.result) { rec[m.a].opps.push(m.b); rec[m.b].opps.push(m.a); return; }
    ['a','b'].forEach(s=>{const id=m[s],o=outcome(m,s),r=rec[id];
      r[o==='W'?'w':o==='L'?'l':'d']++; r.pts+=PTS[o]; r.played++; r.opps.push(s==='a'?m.b:m.a);});
  }));
  const mwp={};
  for(const id in rec){const r=rec[id];
    // own win% excluding byes, floored 25%
    let w=r.w-r.byes, n=r.played; mwp[id]= n? Math.max(0.25,w/n):0.25; r.mwp=mwp[id];}
  for(const id in rec){const r=rec[id]; r.owp=r.opps.length? r.opps.reduce((s,o)=>s+mwp[o],0)/r.opps.length:0;}
  for(const id in rec){const r=rec[id]; r.oowp=r.opps.length? r.opps.reduce((s,o)=>s+rec[o].owp,0)/r.opps.length:0;}
  return rec;
}
function standings(state){
  const rec=records(state);
  return Object.values(rec).sort((x,y)=>y.pts-x.pts||y.owp-x.owp||y.oowp-x.oowp||x.name.localeCompare(y.name));
}
function shuffle(a,rand){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pairRound(state,rand){
  rand=rand||Math.random;
  const rec=records(state);
  const active=state.players.filter(p=>!p.dropped).map(p=>p.id);
  let order;
  if(state.rounds.length===0) order=shuffle(active,rand);
  else { // shuffle within equal points first so ties are random, then by standings
    const st=standings(state).filter(r=>!r.dropped).map(r=>r.id);
    order=st;
  }
  const played=id=>new Set(rec[id].opps);
  function pairList(list){ // backtracking
    if(!list.length) return [];
    const [first,...rest]=list, pf=played(first);
    for(let i=0;i<rest.length;i++){ if(pf.has(rest[i])) continue;
      const sub=pairList(rest.slice(0,i).concat(rest.slice(i+1)));
      if(sub) return [[first,rest[i]],...sub]; }
    return null;
  }
  let byeCands=[null];
  if(order.length%2){ const rev=order.slice().reverse();
    byeCands=rev.filter(id=>rec[id].byes===0).concat(rev.filter(id=>rec[id].byes>0)); }
  for(const bye of byeCands){
    const list=order.filter(id=>id!==bye);
    let pairs=pairList(list), rematch=false;
    if(!pairs){ // fallback: allow rematches, adjacent pairing
      pairs=[]; for(let i=0;i<list.length;i+=2) pairs.push([list[i],list[i+1]]); rematch=true;
      if(bye!==byeCands[byeCands.length-1]) continue; }
    const matches=pairs.map((p,i)=>({table:i+1,a:p[0],b:p[1],result:null}));
    if(bye!==null) matches.push({table:matches.length+1,a:bye,b:null,result:'BYE'});
    return {matches,rematch};
  }
}
function defaultRounds(n){return Math.max(1,Math.ceil(Math.log2(Math.max(2,n))));}
const api={records,standings,pairRound,defaultRounds,outcome};
if(typeof module!=='undefined') module.exports=api; else root.Swiss=api;
})(this);
</script>
<script>
const GAMES={pokemon:'Pokémon TCG',lorcana:'Disney Lorcana',mhr:'Marvel Hero Rush'};
const RES={A:'甲勝',D:'和',B:'乙勝',FA:'甲棄權',FB:'乙棄權',FF:'雙方棄權'};
const KEY='ciaocard-swiss-v1';const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,tab='round',swapSel=null,search='';
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=fresh();}
function fresh(){return{name:'',game:'pokemon',totalRounds:0,players:[],rounds:[],started:false,finished:false,nid:1,base:''}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
const nm=id=>id?(S.players.find(p=>p.id===id)||{}).name:'輪空 (Bye)';
const pct=x=>(x*100).toFixed(1)+'%';
function cur(){return S.rounds[S.rounds.length-1]}
function roundDone(){const r=cur();return r&&r.matches.every(m=>m.result)}

// ---------- Player view ----------
function playerView(d){
  S=d;$('#sub').textContent=(GAMES[d.game]||'')+(d.name?' · '+d.name:'');
  const r=cur(),st=Swiss.standings(d);
  const draw=()=>{const q=search.trim().toLowerCase();
  app.innerHTML=`<div class="card"><h2>${d.finished?'最終排名':r?`第 ${S.rounds.length} / ${d.totalRounds} 輪配對`:'未開始'}</h2>
  <input id="q" placeholder="🔍 搜尋你個名" value="${esc(search)}">
  <p class="muted">更新時間：${esc(d.ts||'')}　(主辦每輪會出新 QR／連結，請重新掃描)</p></div>
  ${r&&!d.finished?`<div class="card">${r.matches.map(m=>{const hit=q&&(nm(m.a)+' '+nm(m.b)).toLowerCase().includes(q);
   return `<div class="m ${hit?'hl':''}"><span class="t">${m.b?'枱 '+m.table:'輪空'}</span>　${esc(nm(m.a))} ${m.b?' vs '+esc(nm(m.b)):''}${m.result&&m.b?` <span class="muted">（${RES[m.result]}）</span>`:''}</div>`}).join('')}</div>`:''}
  <div class="card"><h2>排名</h2>${standTable(st,q)}</div>`;
  const i=$('#q');i.oninput=e=>{search=e.target.value;draw();const j=$('#q');j.focus();j.setSelectionRange(99,99)};};
  draw();
}
function standTable(st,q){return `<table><tr><th>#</th><th>名</th><th>分</th><th>勝-負-和</th><th>OWP</th><th>OOWP</th></tr>${st.map((r,i)=>
 `<tr class="${q&&r.name.toLowerCase().includes(q)?'hl':''}"><td>${i+1}</td><td>${esc(r.name)}${r.dropped?' <span class="muted">(退出)</span>':''}</td><td><b>${r.pts}</b></td><td>${r.w}-${r.l}-${r.d}</td><td>${pct(r.owp)}</td><td>${pct(r.oowp)}</td></tr>`).join('')}</table>`}

// ---------- Organizer ----------
function render(){save();$('#sub').textContent=GAMES[S.game]+(S.name?' · '+S.name:'');
  if(!S.started) return setup();
  const r=cur();
  app.innerHTML=`<div class="tabs"><button class="${tab=='round'?'':'g'}" onclick="tab='round';render()">今輪</button><button class="${tab=='stand'?'':'g'}" onclick="tab='stand';render()">排名</button><button class="${tab=='pub'?'':'g'}" onclick="tab='pub';render()">發佈俾玩家</button><button class="${tab=='more'?'':'g'}" onclick="tab='more';render()">管理</button></div><div id="pane"></div>`;
  const P=$('#pane');
  if(tab=='round'){
    P.innerHTML=`<div class="card"><h2>${S.finished?'比賽完結 🎉':`第 ${S.rounds.length} / ${S.totalRounds} 輪`}</h2>
    <p class="muted">入晒結果先可以去下一輪。想調換配對：㩒兩位玩家個名（未入結果嘅枱）。</p>
    ${r.matches.map((m,i)=>`<div class="m ${m.result?'done':''}"><span class="t">${m.b?'枱 '+m.table:'輪空'}</span>
     <span class="pl ${swapSel&&swapSel.i==i&&swapSel.s=='a'?'sel':''}" onclick="sw(${i},'a')">甲：<b>${esc(nm(m.a))}</b></span>${m.b?` vs <span class="pl ${swapSel&&swapSel.i==i&&swapSel.s=='b'?'sel':''}" onclick="sw(${i},'b')">乙：<b>${esc(nm(m.b))}</b></span>`:' <span class="muted">（自動計勝 3 分）</span>'}
     ${m.b&&!S.finished?`<div class="res">${Object.keys(RES).map(k=>`<button class="s ${m.result==k?'on':''}" onclick="setRes(${i},'${k}')">${RES[k]}</button>`).join('')}</div>`:''}</div>`).join('')}
    ${S.finished?'':S.rounds.length<S.totalRounds?`<button ${roundDone()?'':'disabled'} onclick="next()">開始下一輪 ▶</button>`:`<button ${roundDone()?'':'disabled'} onclick="finish()">完成比賽 🏆</button>`}
    ${S.rounds.length>0&&!S.finished?`<button class="g" onclick="repair()">重新配對今輪</button>`:''}</div>`;
  }
  if(tab=='stand') P.innerHTML=`<div class="card"><h2>${S.finished?'最終排名':'即時排名'}</h2>${standTable(Swiss.standings(S))}<p class="muted">同分先睇 OWP（對手勝率，每人最低計 25%，輪空不計），再睇 OOWP。</p></div>`;
  if(tab=='pub'){const url=pubUrl();P.innerHTML=`<div class="card"><h2>玩家連結／QR（每輪重新發佈）</h2>
    <div id="qr" style="text-align:center"></div><input readonly value="${esc(url)}" onclick="this.select()">
    <button onclick="navigator.clipboard.writeText('${url}').then(()=>alert('已複製'))">複製連結</button>
    <a href="https://wa.me/?text=${encodeURIComponent((S.name||'CiaoCard 比賽')+' 第'+S.rounds.length+'輪配對／排名：'+url)}" target="_blank"><button class="g">WhatsApp 分享</button></a>
    <p class="muted">連結入面已經包含今刻嘅配對同排名，唔使伺服器。入完結果或者開新一輪後，返嚟呢頁攞新 QR。</p>
    <p class="muted">公開網址基底：<input id="base" value="${esc(S.base||defBase())}" onchange="S.base=this.value;render()"></p></div>`;
    const q=qrcode(0,'L');q.addData(url);q.make();$('#qr').innerHTML=q.createSvgTag({cellSize:4,margin:2});}
  if(tab=='more') P.innerHTML=`<div class="card"><h2>加遲到玩家</h2><div class="row"><input id="late" placeholder="名"><button onclick="late()">加入</button></div><p class="muted">下一輪開始參與（0 分起計）。</p></div>
    <div class="card"><h2>玩家退出 (Drop)</h2>${S.players.map(p=>`<div class="row"><span>${esc(p.name)}</span><button class="s ${p.dropped?'':'g'}" onclick="drop('${p.id}')">${p.dropped?'已退出（取消）':'退出'}</button></div>`).join('')}</div>
    <div class="card"><h2>總輪數</h2><input type="number" min="${S.rounds.length}" value="${S.totalRounds}" onchange="S.totalRounds=Math.max(${S.rounds.length},+this.value);S.finished=false;render()"></div>
    ${backupCard()}`;
}
function backupCard(){return `<div class="card"><h2>備份</h2><button class="g" onclick="exp()">匯出 JSON</button><button class="g" onclick="$('#imp').click()">匯入 JSON</button><input type="file" id="imp" accept=".json" style="display:none" onchange="imp(this)">
  <button class="g" onclick="if(confirm('確定清除成個比賽？'))(S=fresh(),render())">開新比賽</button><p class="muted">資料只存喺呢部機嘅瀏覽器。記得每輪匯出備份。</p></div>`}
function setup(){app.innerHTML=`<div class="card"><h2>新比賽</h2>
  比賽名稱<input id="ename" value="${esc(S.name)}" placeholder="例：Weekly 10/12">
  遊戲<select id="game">${Object.entries(GAMES).map(([k,v])=>`<option value="${k}" ${S.game==k?'selected':''}>${v}</option>`).join('')}</select>
  參賽者（每行一個名，可直接貼上名單）<textarea id="names">${esc(S.players.map(p=>p.name).join('\n'))}</textarea>
  <p class="muted" id="cnt"></p>總輪數 <input type="number" id="rounds" min="1">
  <button onclick="start()">開始比賽（隨機配對第 1 輪）</button></div>${backupCard()}`;
  const upd=()=>{const n=names().length;$('#cnt').textContent=n+' 位參賽者，建議 '+Swiss.defaultRounds(n)+' 輪';$('#rounds').placeholder=Swiss.defaultRounds(n)};
  $('#names').oninput=upd;upd();}
function names(){return $('#names').value.split('\n').map(s=>s.replace(/^\s*\d+[.)、]\s*/,'').trim()).filter(Boolean)}
function start(){const n=names();if(n.length<2)return alert('最少 2 位');
  S.name=$('#ename').value.trim();S.game=$('#game').value;S.players=n.map(x=>({id:'p'+S.nid++,name:x}));
  S.totalRounds=+$('#rounds').value||Swiss.defaultRounds(n.length);S.started=true;S.rounds=[];newRound();tab='round';render();}
function newRound(){const p=Swiss.pairRound(S);S.rounds.push({matches:p.matches});if(p.rematch)alert('注意：避唔到重複對手，有枱係再撞。');}
function setRes(i,k){const m=cur().matches[i];m.result=m.result==k?null:k;render();}
function next(){swapSel=null;newRound();render();}
function repair(){if(cur().matches.some(m=>m.b&&m.result)&&!confirm('今輪已有結果，會清除，確定？'))return;S.rounds.pop();newRound();render();}
function finish(){S.finished=true;tab='stand';render();}
function sw(i,s){if(S.finished)return;const m=cur().matches[i];if(m.b&&m.result)return alert('呢枱已有結果，先取消結果再調換');
  if(!swapSel){swapSel={i,s};return render();}const o=cur().matches[swapSel.i];if(o.b&&o.result){swapSel=null;return render()}
  [o[swapSel.s],m[s]]=[m[s],o[swapSel.s]];swapSel=null;render();}
function late(){const v=$('#late').value.trim();if(!v)return;S.players.push({id:'p'+S.nid++,name:v});alert(v+' 已加入，下一輪開始配對');render();}
function drop(id){const p=S.players.find(p=>p.id===id);p.dropped=!p.dropped;render();}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='ciaocard-swiss-'+(S.name||'event')+'-R'+S.rounds.length+'.json';a.click();}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{S=JSON.parse(t);render()}).catch(()=>alert('檔案唔啱'))}
function defBase(){return location.href.split('#')[0]}
function pubUrl(){const d={name:S.name,game:S.game,totalRounds:S.totalRounds,finished:S.finished,ts:new Date().toLocaleString('zh-HK'),
  players:S.players.map(p=>p.dropped?{id:p.id,name:p.name,dropped:1}:{id:p.id,name:p.name}),rounds:S.rounds.map(r=>({matches:r.matches.map(m=>({table:m.table,a:m.a,b:m.b,result:m.result}))}))};
  return (S.base||defBase())+'#v='+LZString.compressToEncodedURIComponent(JSON.stringify(d));}
const h=location.hash;
if(h.startsWith('#v=')){try{playerView(JSON.parse(LZString.decompressFromEncodedURIComponent(h.slice(3))))}catch(e){app.innerHTML='<div class="card">連結損壞，請重新掃描 QR。</div>'}}
else{load();render();}
window.onhashchange=()=>location.reload();
</script></body></html>
